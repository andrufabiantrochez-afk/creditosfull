<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Créditos - Andrew</title>
    
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mis Créditos">

    <link rel="manifest" href="./manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-5 shadow-md relative z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold"><i class="fa-solid fa-wallet mr-2"></i> Mis Créditos</h1>
                <p class="text-xs text-indigo-200">Control de pagos y alertas</p>
            </div>
            <div>
                <button type="button" onclick="abrirModalDefinitivo()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-lg transition active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-plus mr-1"></i> Nuevo
                </button>
            </div>
        </div>
    </header>

    <!-- Resumen -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-400 font-medium uppercase">Cuotas este Mes</p>
                <p id="totalMes" class="text-lg font-bold text-slate-700">$0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-400 font-medium uppercase">Pendientes</p>
                <p id="totalPendientes" class="text-lg font-bold text-indigo-600">0</p>
            </div>
        </div>

        <!-- Lista de Créditos -->
        <div id="listaCreditos" class="space-y-3">
            <!-- Se inyecta dinámicamente -->
        </div>
    </main>

    <!-- Modal para Agregar/Editar Crédito -->
    <div id="modalCredito" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 id="modalTitulo" class="text-lg font-bold text-slate-800">Agregar Crédito</h2>
                <button type="button" onclick="cerrarModalDefinitivo()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold px-2 cursor-pointer">&times;</button>
            </div>
            
            <form id="formCredito" onsubmit="guardarCreditoDefinitivo(event)" class="space-y-3">
                <input type="hidden" id="creditoId">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Nombre del Crédito / Entidad</label>
                    <input type="text" id="nombre" required placeholder="Ej. Préstamo Banco X" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">No. de Crédito</label>
                        <input type="text" id="numCredito" placeholder="Ej. 4589-XXX" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Día de Pago (1-31)</label>
                        <input type="number" id="diaPago" min="1" max="31" required placeholder="Ej. 15" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Valor Cuota ($)</label>
                        <input type="number" id="valor" required placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Monto Total Deuda ($)</label>
                        <input type="number" id="montoTotal" placeholder="Ej. 5000000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Cuota Actual</label>
                        <input type="number" id="cuotaActual" placeholder="Ej. 5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Cuotas Totales</label>
                        <input type="number" id="cuotasTotales" placeholder="Ej. 24" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Notas / Link de pago (Opcional)</label>
                    <input type="text" id="notas" placeholder="Ej. Link PSE o sucursal" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition mt-2 cursor-pointer">
                    Guardar Crédito
                </button>
            </form>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        let creditos = JSON.parse(localStorage.getItem('mis_creditos_v8')) || [];

        function abrirModalDefinitivo(id = null) {
            const modal = document.getElementById('modalCredito');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            if (id !== null) {
                document.getElementById('modalTitulo').innerText = 'Editar Crédito';
                const cred = creditos.find(c => c.id === id);
                if(cred) {
                    document.getElementById('creditoId').value = cred.id;
                    document.getElementById('nombre').value = cred.nombre;
                    document.getElementById('numCredito').value = cred.numCredito || '';
                    document.getElementById('valor').value = cred.valor;
                    document.getElementById('montoTotal').value = cred.montoTotal || '';
                    document.getElementById('diaPago').value = cred.diaPago;
                    document.getElementById('cuotaActual').value = cred.cuotaActual || '';
                    document.getElementById('cuotasTotales').value = cred.cuotasTotales || '';
                    document.getElementById('notas').value = cred.notas || '';
                }
            } else {
                document.getElementById('modalTitulo').innerText = 'Agregar Crédito';
                document.getElementById('formCredito').reset();
                document.getElementById('creditoId').value = '';
            }
        }

        function cerrarModalDefinitivo() {
            const modal = document.getElementById('modalCredito');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function guardarCreditoDefinitivo(e) {
            e.preventDefault();
            const id = document.getElementById('creditoId').value;
            const nuevoCredito = {
                id: id ? Number(id) : Date.now(),
                nombre: document.getElementById('nombre').value,
                numCredito: document.getElementById('numCredito').value,
                valor: Number(document.getElementById('valor').value),
                montoTotal: document.getElementById('montoTotal').value ? Number(document.getElementById('montoTotal').value) : 0,
                diaPago: Number(document.getElementById('diaPago').value),
                cuotaActual: document.getElementById('cuotaActual').value,
                cuotasTotales: document.getElementById('cuotasTotales').value,
                notas: document.getElementById('notas').value,
                pagado: false
            };

            if (id) {
                const index = creditos.findIndex(c => c.id === Number(id));
                if(index !== -1) {
                    nuevoCredito.pagado = creditos[index].pagado;
                    creditos[index] = nuevoCredito;
                }
            } else {
                creditos.push(nuevoCredito);
            }

            localStorage.setItem('mis_creditos_v8', JSON.stringify(creditos));
            cerrarModalDefinitivo();
            renderizarApp();
        }

        function eliminarCredito(id) {
            if (confirm('¿Estás seguro de eliminar este crédito?')) {
                creditos = creditos.filter(c => c.id !== id);
                localStorage.setItem('mis_creditos_v8', JSON.stringify(creditos));
                renderizarApp();
            }
        }

        function togglePagado(id) {
            const cred = creditos.find(c => c.id === id);
            if(cred) {
                cred.pagado = !cred.pagado;
                localStorage.setItem('mis_creditos_v8', JSON.stringify(creditos));
                renderizarApp();
            }
        }

        function calcularDiasRestantes(diaPago) {
            const hoy = new Date();
            const anio = hoy.getFullYear();
            const mes = hoy.getMonth();
            
            let fechaVencimiento = new Date(anio, mes, diaPago);
            if (hoy > fechaVencimiento) {
                fechaVencimiento = new Date(anio, mes + 1, diaPago);
            }
            
            const diferenciaTiempo = fechaVencimiento - hoy;
            return Math.ceil(diferenciaTiempo / (1000 * 60 * 60 * 24));
        }

        function renderizarApp() {
            const contenedor = document.getElementById('listaCreditos');
            contenedor.innerHTML = '';
            
            let totalMes = 0;
            let pendientesCount = 0;

            if (creditos.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 p-6 shadow-sm">
                        <i class="fa-solid fa-receipt text-slate-300 text-4xl mb-2"></i>
                        <p class="text-slate-500 font-medium">No tienes créditos agregados</p>
                        <p class="text-xs text-slate-400 mt-1">Toca el botón "Nuevo" para registrar el primero.</p>
                    </div>
                `;
                document.getElementById('totalMes').innerText = '$0';
                document.getElementById('totalPendientes').innerText = '0';
                return;
            }

            creditos.forEach(c => {
                totalMes += c.valor;
                if (!c.pagado) pendientesCount++;

                const dias = calcularDiasRestantes(c.diaPago);
                
                let alertaClase = "bg-emerald-50 text-emerald-700 border-emerald-100";
                let textoAlerta = `Faltan ${dias} días`;
                let iconoAlerta = "fa-circle-check text-emerald-500";

                if (c.pagado) {
                    alertaClase = "bg-slate-100 text-slate-500 border-slate-200 opacity-60";
                    textoAlerta = "Cuota Pagada";
                    iconoAlerta = "fa-check-double text-slate-400";
                } else if (dias <= 0) {
                    alertaClase = "bg-rose-50 text-rose-700 border-rose-200 animate-pulse";
                    textoAlerta = dias === 0 ? "¡Vence hoy!" : `¡Vencido hace ${Math.abs(dias)} días!`;
                    iconoAlerta = "fa-triangle-exclamation text-rose-500";
                } else if (dias <= 4) {
                    alertaClase = "bg-amber-50 text-amber-700 border-amber-200";
                    textoAlerta = `Próximo a vencer (${dias} días)`;
                    iconoAlerta = "fa-clock text-amber-500";
                }

                const cardHTML = `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 transition space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${alertaClase} inline-flex items-center gap-1.5 mb-1">
                                    <i class="fa-solid ${iconoAlerta}"></i> ${textoAlerta}
                                </span>
                                <h3 class="font-bold text-slate-800 text-base">${c.nombre}</h3>
                                ${c.numCredito ? `<p class="text-xs text-indigo-600 font-medium mt-0.5"><i class="fa-solid fa-hashtag mr-1"></i>Crédito No: ${c.numCredito}</p>` : ''}
                                ${c.notas ? `<p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-note-sticky mr-1"></i>${c.notas}</p>` : ''}
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-slate-400 uppercase font-medium">Cuota Mensual</p>
                                <p class="text-base font-bold text-slate-800">$${c.valor.toLocaleString()}</p>
                                <p class="text-xs text-slate-400 mt-0.5">Paga el día ${c.diaPago}</p>
                            </div>
                        </div>

                        ${c.montoTotal ? `
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-500">Monto Total Deuda: <b class="text-slate-700">$${c.montoTotal.toLocaleString()}</b></span>
                            <span class="text-indigo-600 font-semibold">Cuota ${c.cuotaActual \vert{}\vert{} '-'} de${c.cuotasTotales || '-'}</span>
                        </div>
                        ` : `
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-500">Progreso:</span>
                            <span class="text-indigo-600 font-semibold">Cuota ${c.cuotaActual \vert{}\vert{} '-'} de${c.cuotasTotales || '-'}</span>
                        </div>
                        `}

                        <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs text-slate-500">
                            <span>Acciones</span>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="togglePagado(${c.id})" class="px-3 py-1.5 rounded-lg font-medium text-xs transition ${c.pagado ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'} cursor-pointer">
                                    <i class="fa-solid ${c.pagado ? 'fa-rotate-left' : 'fa-check'} mr-1"></i> ${c.pagado ? 'Desmarcar' : 'Marcar Pagado'}
                                </button>
                                <button type="button" onclick="abrirModalDefinitivo(${c.id})" class="text-slate-400 hover:text-indigo-600 p-1.5 cursor-pointer"><i class="fa-solid fa-pen"></i></button>
                                <button type="button" onclick="eliminarCredito(${c.id})" class="text-slate-400 hover:text-rose-600 p-1.5 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += cardHTML;
            });

            document.getElementById('totalMes').innerText = `$${totalMes.toLocaleString()}`;
            document.getElementById('totalPendientes').innerText = pendientesCount;
        }

        renderizarApp();
    </script>
</body>
</html>
